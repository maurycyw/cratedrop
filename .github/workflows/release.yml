name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC: this is what PyPI trusts — no API token anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv run pytest tests/ -q   # never release untested
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
