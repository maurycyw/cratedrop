name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — no API token anywhere
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: tag must match project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(uvx --from toml-cli toml get --toml-path pyproject.toml project.version)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag != pyproject version $ver"; exit 1
          fi
      - run: uv sync && uv run pytest tests/ -q   # never release untested
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## ${GITHUB_REF_NAME}/{f=1;next} /^## v/{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "cratedrop $GITHUB_REF_NAME" \
            --notes-file notes.md || echo "release already exists"
